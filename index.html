<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Цифровой двойник МС-АСП: кран-балка, траверса с подвижными каретками, датчики, логика ПЛК ОВЕН ПЛК210 и гашение раскачивания ZVD.">
<title>МС-АСП цифровой двойник</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Один визуальный мир: тёмный кинематографичный цех на весь экран,
   поверх — стеклянные панели пульта оператора в сигнальном жёлтом. */
:root{
  --glass:rgba(13,17,21,.72); --glass-2:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
  --fg:#e9edf0; --muted:#9aa6b1; --accent:#f2b200; --accent-ink:#201800;
  --ok:#47c27a; --warn:#f0a43a; --bad:#ff5d5d; --steel:#6fa8dc; --bg:#0d1115;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cap{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.09em;font-size:12px;color:var(--muted);font-weight:600}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}

/* верхняя полоса */
.top{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));
  display:flex;gap:10px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;padding:8px 14px 8px 12px;min-width:0;max-width:min(640px,100%)}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.03em;margin:0;line-height:1;white-space:nowrap}
.brand h1 i{display:inline-block;width:10px;height:10px;background:var(--accent);margin-right:8px;transform:translateY(-2px)}
.state{display:flex;flex-direction:column;gap:1px;min-width:0;border-left:1px solid var(--line);padding-left:12px}
.state b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;display:flex;align-items:center;gap:7px}
.state b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.state.run b::before{background:var(--steel)} .state.bad b::before{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.state span{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.seg{display:inline-flex;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.04em;color:var(--muted)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:var(--fg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* правая панель */
.panel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));
  width:300px;display:flex;flex-direction:column;overflow:auto;scrollbar-width:thin}
.panel section{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.panel section:last-child{border-bottom:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.key{border:1px solid var(--line);background:var(--glass-2);padding:9px 2px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-family:var(--f-display);font-weight:600;font-size:16px;user-select:none;touch-action:none;line-height:1}
.key small{font-family:var(--f-body);font-weight:400;font-size:10.5px;color:var(--muted);margin-top:3px}
.key:hover{border-color:rgba(255,255,255,.3)}
.key.on{background:var(--fg);color:#111} .key.on small{color:#333}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.auto{border:0;background:var(--accent);color:var(--accent-ink);padding:11px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em}
.auto.on{background:#fff;color:#111}
.estop{border:0;background:#c62828;color:#fff;padding:11px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em}
.estop.on{background:#5a0f0f;box-shadow:inset 0 0 0 2px #ff5d5d}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.mod{border:1px solid var(--line);background:var(--glass-2);padding:7px 9px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px}
.mod b{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:.02em}
.mod span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mod[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.modeseg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line)}
.modeseg button{border:0;background:none;padding:7px 4px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted);letter-spacing:.02em}
.modeseg button[aria-pressed="true"]{background:var(--fg);color:#111}
.res{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted)}
.res b{font-family:var(--f-mono);font-size:15px;color:var(--fg);font-weight:500}
.res b.bad{color:var(--bad)} .res b.good{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:none;padding:5px 9px;cursor:pointer;font-size:12.5px;color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--bad);background:rgba(255,93,93,.16)}
.togglepanel{display:none}

/* нижний HUD */
.hud{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:stretch;
  max-width:calc(100% - 32px)}
.hud .m{padding:9px 16px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);min-width:0}
.hud .m:last-child{border-right:0}
.hud .v{font-family:var(--f-mono);font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .v small{font-size:12px;color:var(--muted);margin-left:3px}
.hud .v.bad{color:var(--bad)} .hud .v.warn{color:var(--warn)} .hud .v.good{color:var(--ok)}
.slings{display:flex;gap:4px;align-items:flex-end;height:30px;margin-top:3px}
.slings i{width:9px;background:rgba(255,255,255,.12);position:relative;height:100%}
.slings i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--h,0%);background:var(--c,var(--ok))}

/* подписи датчиков */
.lbl{position:absolute;transform:translate(-50%,calc(-100% - 10px));white-space:nowrap;font-size:11.5px;line-height:1.2;
  background:rgba(10,14,18,.78);border:1px solid rgba(255,255,255,.14);padding:4px 7px;color:#eef2f5;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:10px;background:rgba(242,178,0,.9)}
.lbl::before{content:"";position:absolute;left:calc(50% - 3px);top:calc(100% + 8px);width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.lbl b{font-family:var(--f-display);font-weight:600;letter-spacing:.05em;color:var(--accent);font-size:12px;margin-right:6px}
.lbl .mono{font-size:11.5px}
.lbl.dn{transform:translate(-50%,10px)}
.lbl.dn::after{top:auto;bottom:100%}
.lbl.dn::before{top:auto;bottom:calc(100% + 8px)}
.lbl.bad{border-color:var(--bad)} .lbl.bad b{color:var(--bad)} .lbl.bad::before{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.toast{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(98px + env(safe-area-inset-bottom,0px));padding:8px 12px;font-size:13px;max-width:min(460px,calc(100% - 32px));
  transition:opacity .4s;border-left:3px solid var(--accent)}
.toast.bad{border-left-color:var(--bad)}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);letter-spacing:.1em;color:var(--muted);font-size:16px;pointer-events:none}

@media (max-width:900px){
  .panel{top:auto;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));width:auto;max-height:52vh}
  .panel.closed{display:none}
  .togglepanel{display:block;position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(98px + env(safe-area-inset-bottom,0px));
    border:0;background:var(--accent);color:var(--accent-ink);padding:10px 14px;font-family:var(--f-display);font-weight:700;letter-spacing:.06em;cursor:pointer}
  .panel:not(.closed)~.togglepanel{bottom:auto;top:calc(70px + env(safe-area-inset-top,0px))}
  .hud .m{padding:7px 10px}.hud .v{font-size:15px}.hud .hide-s{display:none}
  .toast{display:none}
  .state span{max-width:46vw}
}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c3d" tabindex="0" aria-label="3D-модель цеха: кран-балка, траверса с подвижными каретками и модуль"></canvas>
  <div id="labels"></div>
  <div class="loading" id="loading">ЗАГРУЗКА СЦЕНЫ…</div>

  <div class="top">
    <div class="brand glass">
      <h1><i></i>МС-АСП</h1>
      <div class="state" id="state"><b id="stateTxt">ГОТОВ</b><span id="stepTxt">Ручной режим</span></div>
    </div>
    <div class="spacer"></div>
    <div class="seg glass" id="camSeg" role="group" aria-label="Камера">
      <button data-c="cine" aria-pressed="true">Кино</button><button data-c="all" aria-pressed="false">Цех</button><button data-c="trav" aria-pressed="false">Траверса</button><button data-c="hoist" aria-pressed="false">Таль</button>
    </div>
    <div class="seg glass">
      <button id="lblBtn" aria-pressed="true">Датчики</button>
      <button id="qBtn" aria-pressed="false" title="Качество графики">Высокое</button>
      <button id="spdBtn" aria-pressed="false" title="Скорость времени">×4</button>
    </div>
  </div>

  <div class="panel glass" id="panel">
    <section>
      <span class="cap">Пульт Telecrane F24-8D</span>
      <div class="pad" id="pad">
        <button class="key" data-k="up">▲<small>подъём</small></button>
        <button class="key" data-k="yl">▲ Y<small>тележка</small></button>
        <button class="key" data-k="xf">X ▶<small>мост</small></button>
        <button class="key" data-k="down">▼<small>опускание</small></button>
        <button class="key" data-k="yr">▼ Y<small>тележка</small></button>
        <button class="key" data-k="xb">◀ X<small>мост</small></button>
      </div>
      <div class="row2">
        <button class="key" data-k="slow" data-toggle="1">SLOW<small>малая скорость</small></button>
        <button class="key" data-k="reset">RESET<small>сброс аварии</small></button>
      </div>
      <button class="auto" id="autoBtn">AUTO · ЦИКЛ</button>
      <button class="estop" id="estopBtn">E-STOP</button>
    </section>
    <section>
      <span class="cap">Модуль</span>
      <div class="mods" id="mods"></div>
    </section>
    <section>
      <span class="cap">Гашение раскачивания</span>
      <div class="modeseg" id="modeSeg">
        <button data-m="model" aria-pressed="true">ZVD · модель</button><button data-m="rope" aria-pressed="false">ZVD · канат</button><button data-m="off" aria-pressed="false">Выкл</button>
      </div>
      <div class="res"><span>Остаток после остановки</span><b id="resV">—</b></div>
      <div class="res"><span>Период: канат / модель</span><b id="perV" class="mono">—</b></div>
    </section>
    <section>
      <span class="cap">Проверка защит</span>
      <div class="chips" id="chips">
        <button class="chip" data-s="person" aria-pressed="false">Человек в зоне</button>
        <button class="chip" data-s="overload" aria-pressed="false">Модуль тяжелее на 15 %</button>
        <button class="chip" data-s="com" aria-pressed="false">Смещён центр масс</button>
        <button class="chip" data-s="short" aria-pressed="false">Строп №2 короче</button>
        <button class="chip" data-s="obstacle" aria-pressed="false">Препятствие при посадке</button>
        <button class="chip" data-s="radio" aria-pressed="false">Потеря связи</button>
        <button class="chip" data-s="cell" aria-pressed="false">Обрыв датчика №3</button>
      </div>
      <button class="chip" id="resetSim" style="align-self:flex-start">Начать заново</button>
    </section>
  </div>
  <button class="togglepanel" id="togglePanel">ПУЛЬТ</button>

  <div class="hud glass">
    <div class="m"><span class="cap">Груз</span><span class="v" id="hMass">0<small>кг</small></span></div>
    <div class="m"><span class="cap">Стропы</span><div class="slings" id="hSl"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="m"><span class="cap">Высота</span><span class="v" id="hZ">0<small>м</small></span></div>
    <div class="m hide-s"><span class="cap">Мост X</span><span class="v" id="hX">0<small>м</small></span></div>
    <div class="m"><span class="cap">Раскачивание</span><span class="v" id="hSway">0<small>мм</small></span></div>
    <div class="m hide-s"><span class="cap">Наклон</span><span class="v" id="hTilt">0<small>°</small></span></div>
  </div>
  <div class="toast glass" id="toast" style="opacity:0"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const LITE = location.hash === '#lite';
const $ = id => document.getElementById(id);
const fmt = (v, d = 0) => v.toLocaleString('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d });

/* ================= Параметры (те же, что GVL_Par в CODESYS) ================= */
const G = 9.81, H_DRUM = 12.0, HOOK_OFS = 0.30, FRAME_L = 4.8, FRAME_B = 2.5, FRAME_H = 0.18;
const H_UP = Math.hypot(FRAME_L / 2, FRAME_B / 2);         // 2,706 м — пирамида верхних стропов 45°
const M_TRAV = 700, M_HOOK = 150, K_ROPE = 3e6, L_LOW = 1.0;
const V_X = 20, V_Y = 10, V_Z = 3, V_CREEP_Z = 0.3, V_SLACK = 0.6;    // м/мин
const PICK = { x: 2, z: 0, top: 0.16 }, PLACE = { x: 12, z: 0, top: 0.62 };
const RATED = 8000, OVL = 1.10, IMB = 20, TILT_S = 2, SLACK_PCT = 60;
const RUN_Z = 7, RAIL_Y = 12.4;
// Рецепты модулей: масса и размеры связаны, точки строповки — по проушинам модуля
const RECIPES = [
  { short: '1 т', dims: '1000×1000×800', m: 1000, L: 1.0, W: 1.0, H: 0.8, pitch: 0.42, gauge: 0.80, col: 0x34594a },
  { short: '3 т', dims: '2500×1500×1200', m: 3000, L: 2.5, W: 1.5, H: 1.2, pitch: 1.10, gauge: 1.30, col: 0x2d4f66 },
  { short: '5 т', dims: '3500×1800×1400', m: 5000, L: 3.5, W: 1.8, H: 1.4, pitch: 1.60, gauge: 1.60, col: 0x5a4636 },
  { short: '8 т', dims: '4500×1800×1500', m: 8000, L: 4.5, W: 1.8, H: 1.5, pitch: 2.10, gauge: 1.60, col: 0x2f4f37 },
];
const ui = { keys: {}, slow: false, auto: false, autoEdge: false, estop: false, mode: 'model', speed: 4, labels: true, rec: 3, sc: {} };
function recipe() {
  const r = { ...RECIPES[ui.rec] };
  if (ui.sc.overload) r.m *= 1.15;              // фактическая масса больше паспортной
  r.ex = ui.sc.com ? 0.25 : 0;                  // смещение центра масс вдоль X

}
function hangLen(r) { return HOOK_OFS + H_UP + FRAME_H + L_LOW + r.H; }
function attachLocal(r) { const o = []; for (const sz of [-1, 1]) for (const k of [-1, 0, 1]) o.push([k * r.pitch, sz * r.gauge / 2]); return o; }
function hookLocal() { const o = []; for (const sz of [-1, 1]) for (const k of [-1, 0, 1]) o.push([k * S.car.pitch, sz * S.car.gauge / 2]); return o; }

/* ================= Модель маятника (FB_AntiSway / sway_model.py) ================= */
function bodyParams(mMod, a, h) {
  const dTr = H_UP + FRAME_H / 2, dMd = H_UP + FRAME_H + L_LOW + h / 2;

}
function modes(l1, bp) {
  const { M, d, Jp } = bp, mh = M_HOOK;
  const a11 = (mh + M) * l1 * l1, a12 = M * l1 * d, a22 = Jp, k1 = (mh + M) * G * l1, k2 = M * G * d;

function pendRHS(s, a, l1, bp, out) {
  const [t1, t2, w1, w2] = s, { M, d, Jp } = bp, mh = M_HOOK;

  const f2 = M * l1 * d * sn * w1 * w1 - M * d * Math.cos(t2) * a - M * G * d * Math.sin(t2) - damp * m22 * (w2 - w1);

}
const K1 = new Float64Array(4), K2 = new Float64Array(4), K3 = new Float64Array(4), K4 = new Float64Array(4), TMP = new Float64Array(4);
function rk4(s, a, l1, bp, dt) {
  pendRHS(s, a, l1, bp, K1);
  for (let i = 0; i < 4; i++) TMP[i] = s[i] + dt / 2 * K1[i]; pendRHS(TMP, a, l1, bp, K2);
  for (let i = 0; i < 4; i++) TMP[i] = s[i] + dt / 2 * K2[i]; pendRHS(TMP, a, l1, bp, K3);
  for (let i = 0; i < 4; i++) TMP[i] = s[i] + dt * K3[i]; pendRHS(TMP, a, l1, bp, K4);

  let steps = 0;
  while (acc >= 0.01 && steps < 80) {
    const vX0 = P.vX, vY0 = P.vY;
    plcTick(0.01);
    for (let i = 0; i < 5; i++) physStep(0.002, vX0, P.vX, vY0, P.vY, (i + 1) / 5);
    personStep(0.01); S.t += 0.01; acc -= 0.01; steps++;
    if (S.mod.hanging) { const bp = bodyParams(r.m, r.L, r.H); S.dev = (S.l1 * Math.sin(S.swX[0]) + bp.d * Math.sin(S.swX[1])) * 1000; } else S.dev = 0;
    const moving = Math.abs(P.vX) > 0.01;
    if (wasMoving && !moving) { stopT = S.t; peak = 0; }
    if (moving) stopT = null;
    if (stopT !== null && S.t - stopT > 0.5 && S.t - stopT < 12 && S.mod.hanging) { peak = Math.max(peak, Math.abs(S.dev)); S.res = peak; }
    wasMoving = moving;
  }
  if (steps >= 80) acc = 0;
  const w = canvas.clientWidth, h = canvas.clientHeight, key = w + 'x' + h + ':' + renderer.getPixelRatio();
  if (key !== lastSize) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); } lastSize = key; }
  syncScene();
  if (camMode === 'cine') cinematic(real);
  controls.update();
  if (composer && quality > 0) composer.render(); else renderer.render(scene, camera);
  updateLabels(w, h);
  if (now - lastHud > 120) { renderHud(); lastHud = now; }
  requestAnimationFrame(frame);
}
